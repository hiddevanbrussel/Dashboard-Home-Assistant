name: Build & Push Docker

# Speed strategy:
# - main pushes: amd64 only (no QEMU) — typically a few minutes
# - version tags: amd64 + native arm64 runners, then merge app multi-arch manifests
# Addon images stay per-arch paths (HA expects .../addon/{arch}:version)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  # Keep lowercase for GHCR + Home Assistant arch image paths
  IMAGE_NAME: hiddevanbrussel/dashboard-home-assistant
  ADDON_IMAGE_NAME: hiddevanbrussel/dashboard-home-assistant-addon

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # App image (Docker / Unraid)
  # ---------------------------------------------------------------------------
  build-app-amd64:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }}

      # main: push tagged amd64 image directly (fast path).
      - name: Build and push (amd64 tagged)
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,mode=max,scope=app-amd64

      # tags: push by digest; merge-app creates the multi-arch tag.
      - name: Build and push (amd64 by digest)
        if: github.ref_type == 'tag'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,mode=max,scope=app-amd64

      - name: Export digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: app-digests-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-app-arm64:
    if: github.ref_type == 'tag'
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build and push (arm64 by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-arm64
          cache-to: type=gha,mode=max,scope=app-arm64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: app-digests-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-app:
    if: github.ref_type == 'tag'
    needs: [version, build-app-amd64, build-app-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: app-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  # ---------------------------------------------------------------------------
  # Addon images — HA pulls ghcr.io/.../addon/{arch}:version
  # ---------------------------------------------------------------------------
  build-addon-amd64:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (addon amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.addon
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ADDON_IMAGE_NAME }}/amd64:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ADDON_IMAGE_NAME }}/amd64:latest
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_ARCH=amd64
            NEXT_BASE_PATH=/__ha_ingress__
          cache-from: type=gha,scope=addon-amd64
          cache-to: type=gha,mode=max,scope=addon-amd64

  build-addon-arm64:
    if: github.ref_type == 'tag'
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (addon aarch64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.addon
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ADDON_IMAGE_NAME }}/aarch64:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ADDON_IMAGE_NAME }}/aarch64:latest
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_ARCH=aarch64
            NEXT_BASE_PATH=/__ha_ingress__
          cache-from: type=gha,scope=addon-arm64
          cache-to: type=gha,mode=max,scope=addon-arm64
