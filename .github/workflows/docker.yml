name: Build & Push Docker

# Publishing runs only when a version tag is pushed.
# Stable tags (vX.Y.Z) build amd64 and arm64/aarch64 for the app and the add-on.
# They publish the version, the minor tag (X.Y) and latest.
# An existing version tag is refused (not overwritten). latest may move.
# Prerelease tags (the tag name contains "-", for example v0.5.12-beta.1)
# publish only the app tags X.Y.Z-beta.N and beta. They do not move latest or X.Y,
# and the add-on jobs do not run.
# Pushes to main do not publish images. Do not push a -beta tag until this
# workflow is on main.

on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  # Keep lowercase for GHCR + Home Assistant arch image paths
  IMAGE_NAME: hiddevanbrussel/dashboard-home-assistant
  ADDON_IMAGE_NAME: hiddevanbrussel/dashboard-home-assistant-addon

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          # A prerelease tag is any v* tag whose name contains "-".
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "version=${version} prerelease=${prerelease}"

  # ---------------------------------------------------------------------------
  # App image (Docker / Unraid)
  # Tag block (keep identical in the app jobs and docker-beta-dry-run.yml):
  # flavor latest=false, so latest is only the explicit raw tag below.
  # Stable: version, X.Y, latest. Prerelease: version and beta.
  # Every tag sets enable=; do not rely on metadata-action defaults.
  # ---------------------------------------------------------------------------
  build-app-amd64:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=true
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=true
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ needs.version.outputs.prerelease == 'true' }}

      # Push by digest; merge-app creates the multi-arch tag, including latest or beta.
      - name: Guard prerelease tags
        if: github.ref_type == 'tag'
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${PRERELEASE}" != "true" ]]; then
            echo "Stable release; prerelease tag guard skipped"
            exit 0
          fi
          if [[ -z "${DOCKER_METADATA_OUTPUT_JSON:-}" ]]; then
            echo "::error::Prerelease tag guard did not receive Docker metadata"
            exit 1
          fi
          mapfile -t refs < <(jq -r '.tags[]' <<<"${DOCKER_METADATA_OUTPUT_JSON}")
          if [[ "${#refs[@]}" -eq 0 ]]; then
            echo "::error::Prerelease produced no image tags"
            exit 1
          fi
          fail=0
          for ref in "${refs[@]}"; do
            tag="${ref##*:}"
            if [[ "${tag}" == "latest" || "${tag}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Prerelease must not publish ${tag} (${ref})"
              fail=1
            fi
          done
          if [[ "${fail}" -ne 0 ]]; then
            exit 1
          fi
          echo "Prerelease tag guard passed"
          printf '%s\n' "${refs[@]}"

      - name: Build and push (amd64 by digest)
        if: success() && github.ref_type == 'tag'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,mode=max,scope=app-amd64

      - name: Export digest
        if: success() && github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: success() && github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-digests-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-app-arm64:
    if: github.ref_type == 'tag'
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=true
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=true
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ needs.version.outputs.prerelease == 'true' }}

      - name: Guard prerelease tags
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${PRERELEASE}" != "true" ]]; then
            echo "Stable release; prerelease tag guard skipped"
            exit 0
          fi
          if [[ -z "${DOCKER_METADATA_OUTPUT_JSON:-}" ]]; then
            echo "::error::Prerelease tag guard did not receive Docker metadata"
            exit 1
          fi
          mapfile -t refs < <(jq -r '.tags[]' <<<"${DOCKER_METADATA_OUTPUT_JSON}")
          if [[ "${#refs[@]}" -eq 0 ]]; then
            echo "::error::Prerelease produced no image tags"
            exit 1
          fi
          fail=0
          for ref in "${refs[@]}"; do
            tag="${ref##*:}"
            if [[ "${tag}" == "latest" || "${tag}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Prerelease must not publish ${tag} (${ref})"
              fail=1
            fi
          done
          if [[ "${fail}" -ne 0 ]]; then
            exit 1
          fi
          echo "Prerelease tag guard passed"
          printf '%s\n' "${refs[@]}"

      - name: Build and push (arm64 by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-arm64
          cache-to: type=gha,mode=max,scope=app-arm64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-digests-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-app:
    if: github.ref_type == 'tag'
    needs: [version, build-app-amd64, build-app-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: app-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=true
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=true
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ needs.version.outputs.prerelease == 'true' }}

      - name: Guard prerelease tags
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${PRERELEASE}" != "true" ]]; then
            echo "Stable release; prerelease tag guard skipped"
            exit 0
          fi
          if [[ -z "${DOCKER_METADATA_OUTPUT_JSON:-}" ]]; then
            echo "::error::Prerelease tag guard did not receive Docker metadata"
            exit 1
          fi
          mapfile -t refs < <(jq -r '.tags[]' <<<"${DOCKER_METADATA_OUTPUT_JSON}")
          if [[ "${#refs[@]}" -eq 0 ]]; then
            echo "::error::Prerelease produced no image tags"
            exit 1
          fi
          fail=0
          for ref in "${refs[@]}"; do
            tag="${ref##*:}"
            if [[ "${tag}" == "latest" || "${tag}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Prerelease must not publish ${tag} (${ref})"
              fail=1
            fi
          done
          if [[ "${fail}" -ne 0 ]]; then
            exit 1
          fi
          echo "Prerelease tag guard passed"
          printf '%s\n' "${refs[@]}"

      - name: Refuse to overwrite an existing version tag
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing image ${image}"
            exit 1
          fi
          echo "${image} is not published yet"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          # Word splitting is intentional: each tag is a separate -t argument.
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  # ---------------------------------------------------------------------------
  # Addon images — HA pulls ghcr.io/.../addon/{arch}:version
  # Prerelease tags skip these jobs entirely, so they push nothing.
  # ---------------------------------------------------------------------------
  build-addon-amd64:
    if: needs.version.outputs.prerelease == 'false'
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Addon amd64 tags
        id: addon-tags
        run: |
          tags="${REGISTRY}/${ADDON_IMAGE_NAME}/amd64:${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${REGISTRY}/${ADDON_IMAGE_NAME}/amd64:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ADDON_IMAGE_NAME: ${{ env.ADDON_IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}

      - name: Refuse to overwrite an existing addon amd64 tag
        run: |
          image="${REGISTRY}/${ADDON_IMAGE_NAME}/amd64:${VERSION}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing image ${image}"
            exit 1
          fi
          echo "${image} is not published yet"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ADDON_IMAGE_NAME: ${{ env.ADDON_IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}

      - name: Build and push (addon amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.addon
          push: true
          platforms: linux/amd64
          tags: ${{ steps.addon-tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_ARCH=amd64
            NEXT_BASE_PATH=/__ha_ingress__
          cache-from: type=gha,scope=addon-amd64
          cache-to: type=gha,mode=max,scope=addon-amd64

  build-addon-arm64:
    if: needs.version.outputs.prerelease == 'false'
    needs: version
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing addon aarch64 tag
        run: |
          image="${REGISTRY}/${ADDON_IMAGE_NAME}/aarch64:${VERSION}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing image ${image}"
            exit 1
          fi
          echo "${image} is not published yet"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          ADDON_IMAGE_NAME: ${{ env.ADDON_IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}

      - name: Build and push (addon aarch64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.addon
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ADDON_IMAGE_NAME }}/aarch64:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.ADDON_IMAGE_NAME }}/aarch64:latest
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_ARCH=aarch64
            NEXT_BASE_PATH=/__ha_ingress__
          cache-from: type=gha,scope=addon-arm64
          cache-to: type=gha,mode=max,scope=addon-arm64
