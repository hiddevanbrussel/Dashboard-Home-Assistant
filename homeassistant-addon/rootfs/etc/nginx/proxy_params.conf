# Shared proxy settings for Next.js behind HA Ingress / direct port.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Ingress-Path $http_x_ingress_path;
proxy_set_header Upgrade $http_upgrade;
# Empty (not "close") when there is no Upgrade — required with upstream keepalive
proxy_set_header Connection $connection_upgrade;
proxy_set_header Accept-Encoding "";

proxy_connect_timeout 60s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;

# sub_filter needs the full uncompressed body; Next chunks can be large
proxy_buffering on;
proxy_buffer_size 128k;
proxy_buffers 8 256k;
proxy_busy_buffers_size 256k;
