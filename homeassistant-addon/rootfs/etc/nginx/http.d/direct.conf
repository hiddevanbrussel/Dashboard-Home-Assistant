# Direct host-port access (mapped 3000/tcp). App lives under /__ha_ingress__.

server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
    server_name _;

    client_max_body_size 64m;

    location = / {
        return 302 /__ha_ingress__;
    }

    location / {
        proxy_pass http://nextjs;
        include /etc/nginx/proxy_params.conf;
    }
}
