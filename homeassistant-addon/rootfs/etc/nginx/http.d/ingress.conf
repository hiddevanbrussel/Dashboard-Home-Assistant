# Home Assistant Ingress — only Supervisor (172.30.32.2) may connect.
# Incoming path is already stripped of /api/hassio_ingress/<token>.
# Next.js is built with basePath /__ha_ingress__; we prefix requests and
# rewrite that placeholder to X-Ingress-Path in responses.

server {
    listen 8099 default_server;
    listen [::]:8099 default_server;
    server_name _;

    allow 172.30.32.2;
    deny all;

    client_max_body_size 64m;

    location / {
        # Prefix the fixed Next.js basePath
        rewrite ^ /__ha_ingress__$uri break;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        # Replace the build-time placeholder with the real ingress path
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json text/plain application/xml;
        sub_filter '/__ha_ingress__' '$http_x_ingress_path';
        # Also catch JSON-escaped and encoded forms used in flight data
        sub_filter '\\u002F__ha_ingress__' '$http_x_ingress_path';
        sub_filter '%2F__ha_ingress__' '$http_x_ingress_path';

        proxy_redirect /__ha_ingress__/ $http_x_ingress_path/;
        proxy_cookie_path /__ha_ingress__ $http_x_ingress_path;
    }
}
