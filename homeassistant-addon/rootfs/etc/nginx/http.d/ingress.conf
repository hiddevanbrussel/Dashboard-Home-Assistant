# Home Assistant Ingress — only Supervisor may connect.
# Incoming path is already stripped of /api/hassio_ingress/<token>.
# Next.js is built with basePath /__ha_ingress__; we prefix requests and
# rewrite that placeholder to X-Ingress-Path in responses + redirects.

server {
    listen 8099 default_server;
    listen [::]:8099 default_server;
    server_name _;

    # Supervisor ingress gateway (+ nearby docker nets used on some installs)
    allow 172.30.32.0/23;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 64m;

    # Root without trailing slash — avoids Next.js 308 that leaks Location outside ingress.
    location = / {
        proxy_pass http://nextjs/__ha_ingress__;
        include /etc/nginx/proxy_params.conf;

        sub_filter_once off;
        sub_filter_types text/css text/javascript application/javascript application/json text/plain application/xml;
        sub_filter '/__ha_ingress__' '$http_x_ingress_path';
        sub_filter '\\u002F__ha_ingress__' '$http_x_ingress_path';
        sub_filter '%2F__ha_ingress__' '$http_x_ingress_path';

        proxy_redirect /__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect /__ha_ingress__ $http_x_ingress_path;
        proxy_redirect http://$host/__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect http://$host/__ha_ingress__ $http_x_ingress_path;
        proxy_cookie_path /__ha_ingress__ $http_x_ingress_path;
    }

    # Binary static media — no body rewrite needed
    location ^~ /_next/static/media/ {
        rewrite ^ /__ha_ingress__$uri break;
        proxy_pass http://nextjs;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        rewrite ^/(.*)$ /__ha_ingress__/$1 break;
        proxy_pass http://nextjs;
        include /etc/nginx/proxy_params.conf;

        sub_filter_once off;
        sub_filter_types text/css text/javascript application/javascript application/json text/plain application/xml;
        sub_filter '/__ha_ingress__' '$http_x_ingress_path';
        sub_filter '\\u002F__ha_ingress__' '$http_x_ingress_path';
        sub_filter '%2F__ha_ingress__' '$http_x_ingress_path';

        proxy_redirect /__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect /__ha_ingress__ $http_x_ingress_path;
        proxy_redirect http://$host/__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect http://$host/__ha_ingress__ $http_x_ingress_path;
        proxy_cookie_path /__ha_ingress__ $http_x_ingress_path;
    }
}
