# Home Assistant Ingress — only Supervisor (172.30.32.2) may connect.
# Incoming path is already stripped of /api/hassio_ingress/<token>.
# Next.js is built with basePath /__ha_ingress__; we prefix requests and
# rewrite that placeholder to X-Ingress-Path in responses + redirects.

server {
    listen 8099 default_server;
    listen [::]:8099 default_server;
    server_name _;

    allow 172.30.32.2;
    deny all;

    client_max_body_size 64m;

    # Root without trailing slash — avoids Next.js 308 (/ → strip slash) which
    # would send Location: /__ha_ingress__ outside the ingress path.
    location = / {
        proxy_pass http://nextjs/__ha_ingress__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        # text/html is implied; listing it again warns "duplicate MIME type"
        sub_filter_types text/css text/javascript application/javascript application/json text/plain application/xml;
        sub_filter '/__ha_ingress__' '$http_x_ingress_path';
        sub_filter '\\u002F__ha_ingress__' '$http_x_ingress_path';
        sub_filter '%2F__ha_ingress__' '$http_x_ingress_path';

        proxy_redirect /__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect /__ha_ingress__ $http_x_ingress_path;
        proxy_redirect http://$host/__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect http://$host/__ha_ingress__ $http_x_ingress_path;
        proxy_cookie_path /__ha_ingress__ $http_x_ingress_path;
    }

    location / {
        # /rooms → /__ha_ingress__/rooms (no double slash)
        rewrite ^/(.*)$ /__ha_ingress__/$1 break;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/css text/javascript application/javascript application/json text/plain application/xml;
        sub_filter '/__ha_ingress__' '$http_x_ingress_path';
        sub_filter '\\u002F__ha_ingress__' '$http_x_ingress_path';
        sub_filter '%2F__ha_ingress__' '$http_x_ingress_path';

        proxy_redirect /__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect /__ha_ingress__ $http_x_ingress_path;
        proxy_redirect http://$host/__ha_ingress__/ $http_x_ingress_path/;
        proxy_redirect http://$host/__ha_ingress__ $http_x_ingress_path;
        proxy_cookie_path /__ha_ingress__ $http_x_ingress_path;
    }
}
