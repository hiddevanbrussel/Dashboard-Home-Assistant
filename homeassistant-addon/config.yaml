name: Dashboard Builder
version: "0.5.8"
slug: dashboard_builder
description: Touchscreen-friendly Home Assistant dashboard with widgets, rooms, energy, and more.
url: https://github.com/hiddevanbrussel/Dashboard-Home-Assistant
arch:
  - aarch64
  - amd64
homeassistant: "2024.8.0"
init: false
ingress: true
ingress_port: 8099
# Proxy buffers full responses for Flight-safe path rewrite — not a streaming backend.
ingress_stream: false
panel_icon: mdi:view-dashboard-variant
panel_title: Dashboard
homeassistant_api: true
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Tablet access on the LAN. Requires the dashboard password. This is not Home Assistant ingress.
options:
  app_secret: ""
  dashboard_password: ""
  pexels_api_key: ""
  immich_url: ""
  immich_api_key: ""
  music_assistant_url: ""
  music_assistant_token: ""
  default_language: en
schema:
  app_secret: password
  dashboard_password: password
  pexels_api_key: str?
  immich_url: str?
  immich_api_key: password?
  music_assistant_url: str?
  music_assistant_token: password?
  default_language: list(en|nl)
image: ghcr.io/hiddevanbrussel/dashboard-home-assistant-addon/{arch}
