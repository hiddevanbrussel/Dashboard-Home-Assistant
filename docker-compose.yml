services:
  app:
    image: ghcr.io/hiddevanbrussel/dashboard-home-assistant:latest
    # For local development from source, comment `image:` and uncomment:
    # build: .
    pull_policy: always
    ports:
      - "3000:3000"
    environment:
      - APP_SECRET=${APP_SECRET:-your-32-byte-secret-for-encryption-change-in-production}
      - DATABASE_URL=file:/data/app.db
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Home Assistant Dashboard Builder}
      # Optional integrations (env overrides Settings UI / browser-stored values):
      # - PEXELS_API_KEY=
      # - IMMICH_URL=http://192.168.1.50:2283
      # - IMMICH_API_KEY=
      # - MUSIC_ASSISTANT_URL=http://192.168.1.50:8095
      # - MUSIC_ASSISTANT_TOKEN=
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
